name: grok-cli
display_name: "xAI Grok CLI"
description: "xAI's terminal agent for Grok models."
tier: supported
cli:
  command: "grok chat --model {model}"
  input_mode: stdin
output:
  format: plain
  parser: generic
workspace:
  type: dir-ephemeral
submodel:
  supports: true
  default: grok-2
  allowed:
    - grok-2
    - grok-2-mini
    - grok-3
auth:
  pool: xai-api-key
  injection: env
  env_vars:
    XAI_API_KEY: "{credential}"
graphify:
  default: compress
capabilities: [code]
routing_default:
  tier: 2
  cost_class: standard
