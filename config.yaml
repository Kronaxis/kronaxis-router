# Kronaxis Router - Configuration
# https://github.com/kronaxis/kronaxis-router
#
# This config demonstrates cost-optimised LLM routing out of the box.
# The core principle: route every request to the CHEAPEST model that can
# reliably deliver the required output quality.
#
# A CFO can fill in accounts receivable, but a bookkeeper is 50x cheaper
# and does the job just as well. Save the CFO for strategic decisions.
#
# Environment variables can be referenced as: "env:VARIABLE_NAME"
# Config is hot-reloaded every 5 seconds -- no restart needed.

server:
  port: 8050
  health_check_interval: 30s
  default_timeout: 120s
  # Queue-aware load balancing: scrape each vLLM backend's /metrics
  # (num_requests_waiting + num_requests_running) and route to the least-loaded
  # node. Composes with per-backend kv_pinning. Only matters with 2+ vLLM nodes.
  queue_aware_routing: false
  queue_scrape_interval: 5s
  # Spot-market arbitrage: route to the cheapest eligible backend. Optional
  # price_feed_url is a JSON map {"<backend>": {"input_1m": x, "output_1m": y}}.
  cost_aware_routing: false
  price_feed_url: ""
  price_feed_interval: 5m
  # Adversarial consensus arbiter (for X-Kronaxis-Consensus requests). Empty =
  # use the first candidate to resolve disagreements.
  consensus_arbiter: ""
  branding:
    headers: true                    # X-Powered-By: Kronaxis Router on every response
    header_name: "Kronaxis Router"
    content_inject: false            # Set true for hosted/SaaS free tier
    content_text: "\n\n---\n*Powered by [Kronaxis Router](https://kronaxis.co.uk)*"
    content_skip_json: true          # Never inject into structured JSON responses

# ──────────────────────────────────────────────────────────────────────
# BACKENDS
# Define every LLM endpoint available to the router.
# Cost is per 1 million tokens (USD). Set realistic prices.
# ──────────────────────────────────────────────────────────────────────

backends:
  # ── Local models (cheapest: electricity only) ──────────────────────

  - name: local-large
    url: "http://localhost:8000"
    type: vllm
    model_name: "large-model"
    cost_input_1m: 0.01              # ~$0.02/hr GPU amortised
    cost_output_1m: 0.01
    capabilities: [json_output, long_context]
    max_concurrent: 4
    lora_adapters: []
    health_endpoint: "/v1/models"
    # KV cache-aware routing: bias follow-up turns to whichever node already
    # has this prompt's prefix warm. Inspect trees at GET /api/kv-trees.
    # kv_pinning:
    #   enabled: true
    #   max_prefix_age_seconds: 600
    #   hash_chunk_tokens: 128
    #   max_nodes: 10000
    # cache_breakpoints: true        # inject Anthropic ephemeral cache markers (Anthropic/OpenRouter backends)

  - name: local-small
    url: "http://localhost:8001"
    type: vllm
    model_name: "small-model"
    cost_input_1m: 0.005             # Smaller model, less GPU
    cost_output_1m: 0.005
    capabilities: [json_output]
    max_concurrent: 8
    lora_adapters: []
    health_endpoint: "/v1/models"

  # ── Cloud models (more expensive, always available) ────────────────

  - name: cloud-fast
    url: "https://generativelanguage.googleapis.com/v1beta"
    type: gemini
    model_name: "gemini-2.5-flash"
    api_key: "env:GEMINI_API_KEY"
    cost_input_1m: 0.15              # 15x more than local
    cost_output_1m: 0.60             # 60x more than local
    capabilities: [json_output, long_context, vision]
    max_concurrent: 50
    lora_adapters: []

  - name: cloud-powerful
    url: "https://generativelanguage.googleapis.com/v1beta"
    type: gemini
    model_name: "gemini-2.5-pro"
    api_key: "env:GEMINI_API_KEY"
    cost_input_1m: 1.25              # 125x more than local
    cost_output_1m: 10.00            # 1000x more than local
    capabilities: [json_output, long_context, vision]
    max_concurrent: 20
    lora_adapters: []

  # ── OpenAI (example, optional) ─────────────────────────────────────

  # - name: openai-4o
  #   url: "https://api.openai.com"
  #   type: openai
  #   model_name: "gpt-4o"
  #   api_key: "env:OPENAI_API_KEY"
  #   cost_input_1m: 2.50
  #   cost_output_1m: 10.00
  #   capabilities: [json_output, long_context, vision]
  #   max_concurrent: 30

  # - name: openai-4o-mini
  #   url: "https://api.openai.com"
  #   type: openai
  #   model_name: "gpt-4o-mini"
  #   api_key: "env:OPENAI_API_KEY"
  #   cost_input_1m: 0.15
  #   cost_output_1m: 0.60
  #   capabilities: [json_output]
  #   max_concurrent: 50

  # ── Agent Gateway (Claude Code as an OpenAI endpoint, optional) ────
  # Brings the full Claude Code CLI (skills, MCP, hooks, file edits) in
  # as a "model". Each request runs in an ephemeral git worktree and
  # returns a diff alongside the assistant text. Internal use only --
  # uses the host's `claude auth login` credentials.
  # Service: kronaxis-router/agent-gateway/  (port 8055)
  # See: docs/plans/2026-05-08-agent-gateway-design.md
  #
  # - name: claude-code-agent
  #   url: "http://localhost:8055"
  #   type: openai
  #   model_name: "claude-code-agent"
  #   cost_input_1m: 0.0          # internal Max sub
  #   cost_output_1m: 0.0
  #   capabilities: [json_output, tools, agentic, file_edit, long_context]
  #   max_concurrent: 4
  #   health_endpoint: "/healthz"

# ──────────────────────────────────────────────────────────────────────
# ROUTING RULES
# Rules are evaluated in priority order (highest first).
# Each rule matches on request metadata and routes to backends in order.
# The router tries each backend until one is healthy and available.
#
# COST-SAVING PRINCIPLES DEMONSTRATED:
#
# 1. STRUCTURED EXTRACTION → small model
#    JSON parsing, classification, scoring, short answers.
#    A 7-9B model handles these as well as a 70B model.
#    Savings: 50-90% vs always using the large model.
#
# 2. HEAVY REASONING → large model
#    Planning, multi-step logic, creative writing, long synthesis.
#    Only these tasks justify the larger model's cost.
#
# 3. BULK/BACKGROUND work → cheapest available
#    Batch enrichment, training data generation, overnight jobs.
#    Latency doesn't matter; cost does. Queue for the cheapest GPU.
#
# 4. INTERACTIVE work → fastest available
#    Chat, phone calls, real-time UI. Skip batching, accept higher cost.
#
# 5. VISION tasks → vision-capable backends only
#    Don't waste routing attempts on backends that can't see images.
#
# 6. BUDGET OVERFLOW → downgrade, don't fail
#    When daily budget is hit, route to a cheaper model instead of
#    returning errors. The work still gets done.
# ──────────────────────────────────────────────────────────────────────

rules:
  # ── Principle 4: Interactive gets priority ─────────────────────────
  # Phone calls, live chat, copilot. Never batch. Use the fast model.
  - name: interactive-priority
    priority: 200
    match:
      priority_level: interactive
    backends: [local-large, cloud-fast]
    # max_ttft_ms: 800   # predictive SLA: drop backends whose rolling p95 exceeds this

  # ── Principle 5: Vision routes to vision-capable backends ──────────
  - name: vision-tasks
    priority: 150
    match:
      content_type: vision
    backends: [cloud-fast, cloud-powerful]
    required_capabilities: [vision]

  # ── Principle 1: Structured extraction → small model ───────────────
  # These tasks need JSON output and short responses. The small model
  # is 50% cheaper and just as accurate for classification/scoring.
  - name: structured-extraction
    priority: 120
    match:
      tier: 2
    backends: [local-small, local-large, cloud-fast]
    max_cost_1m: 0.50

  # ��─ Principle 2: Heavy reasoning → large model ─────────────────────
  # Planning, reflection, creative writing. Worth the extra cost.
  - name: heavy-reasoning
    priority: 110
    match:
      tier: 1
    backends: [local-large, cloud-fast, cloud-powerful]

  # ── Principle 3: Bulk work → cheapest available ────────────────────
  # Enrichment, training data, overnight batch jobs.
  # Always route to the cheapest healthy backend.
  - name: bulk-cheapest
    priority: 100
    match:
      priority_level: bulk
    backends: [local-small, local-large, cloud-fast]
    max_cost_1m: 0.10

  - name: background-cheap
    priority: 100
    match:
      priority_level: background
    backends: [local-small, local-large, cloud-fast]
    max_cost_1m: 0.50

# ──────────────────────────────────────────────────────────────────────
# DEFAULT FALLBACK
# If no rule matches, try these backends in order.
# Cheapest first, cloud as safety net.
# ──────────────────────────────────────────────────────────────────────

defaults:
  fallback_chain: [local-small, local-large, cloud-fast]
  default_timeout_ms: 120000

# ──────────────────────────────────────────────────────────────────────
# BUDGETS (Principle 6: downgrade, don't fail)
# Per-service daily cost limits. When exceeded:
#   "downgrade" → re-route to a cheaper backend
#   "reject"    → return HTTP 429 (use sparingly)
# ──────────────────────────────────────────────────────────────────────

budgets:
  default:
    daily_limit_usd: 50.00
    action: downgrade
    downgrade_target: local-small

  # Example per-service overrides:
  # my-api:
  #   daily_limit_usd: 100.00
  #   action: downgrade
  #   downgrade_target: local-small
  # batch-worker:
  #   daily_limit_usd: 20.00
  #   action: reject

# ──────────────────────────────────────────────────────────────────────
# BATCHING
# Only applies to "background" and "bulk" priority requests.
# "interactive" and "normal" requests are always dispatched immediately.
#
# For vLLM backends: combines multiple prompts into a single
# /v1/completions API call (true batching, one HTTP round-trip).
# For other backends: dispatches concurrently after the window.
#
# The collection window adds latency, so it is only used for work
# where throughput matters more than response time.
# ──────────────────────────────────────────────────────────────────────

batching:
  enabled: true
  window_ms: 50                # Collect for 50ms or until batch is full
  max_batch_size: 8            # Dispatch when 8 requests queued
  priority_bypass:             # These priorities skip batching entirely
    - interactive

# ──────────────────────────────────────────────────────────────────────
# PER-TENANT RATE LIMITS (BoS Completion Spec §3.4 row 5.4)
# Token-bucket rate limiting per tenant on the proxy hot path
# (/v1/chat/completions + /v1/video/generate). Stops a runaway tenant
# from starving every other tenant.
#
# Tenant resolution: X-Kronaxis-Tenant-ID header > X-Kronaxis-Service
# header > "unattributed" bucket. Internal services should be in
# bypass_tenants.
#
# Cookbook: docs/operations/cookbooks/router-rate-limits.md
# Env overrides: RATELIMIT_PER_TENANT_RPM, RATELIMIT_PER_TENANT_BURST,
#                RATELIMIT_DISABLED_TENANTS, RATELIMIT_TENANT_DISABLED.
# ──────────────────────────────────────────────────────────────────────

tenant_rate_limits:
  default_rpm: 60              # Sustained 60 reqs/min per tenant (~1/s)
  default_burst: 10            # Burst capacity (max tokens in bucket)
  unattributed_rpm: 30         # Lower cap for callers with no tenant ID
  unattributed_burst: 5
  bypass_tenants:              # Never rate-limited (internal services)
    - controld
    - billing-agentd
    - updaterd
    - system
  overrides:                   # Per-tenant exceptions
    # Example: paid sovereign customer with higher cap
    # sovereign-customer-acme:
    #   rpm: 600
    #   burst: 100
  disabled: false              # Emergency global off-switch

# ──────────────────────────────────────────────────────────────────────
# GRAPHIFY PRE-STAGE (token-saving RAG in front of every backend)
# Augment thin prompts with project context, or compress fat ones with
# the relevant chunks only. Sits BEFORE classifier + cost routing so the
# savings stack on every backend.
#
# Requires:
#   - DATABASE_URL pointing at a Postgres with pgvector
#   - An embedding backend (default: local sentence-transformers sidecar)
#
# Run `kronaxis-router ingest /path/to/repo` to populate kr_chunks.
# ──────────────────────────────────────────────────────────────────────

graphify:
  enabled: false               # Flip to true when the embedding service is up
  default: "off"               # off | augment | compress | auto
                               # Per-request override via X-Kronaxis-Graphify header.
  ingest_roots:
    - /path/to/your/project
  ingest_excludes: []          # Plus built-in defaults (.git, node_modules, etc.)

  top_k: 5
  min_cosine_sim: 0.4          # Drop weak matches; reduces noise injection
  bm25_weight: 0.3             # 0.0 = pure cosine, 1.0 = pure keyword

  augment_budget_chars: 3200   # ~800 tokens of retrieved context for augment mode
  compress_budget_chars: 4800  # ~1200 tokens for compressed replacement
  auto_compress_chars: 8000    # auto-mode: any single message larger than this triggers compress
  auto_augment_max_chars: 4000 # auto-mode: total prompt smaller than this triggers augment

  # ── Content-aware compression (headroom-inspired) ──────────────────
  # Lossless tier (always_structural) runs on ALL traffic: JSON compaction +
  # prose whitespace, keeps comments, never substitutes. The aggressive tier
  # (per request via X-Kronaxis-Graphify: compress) adds the lossy steps below.
  always_structural: true      # lossless tier on all traffic (default true)
  json_tabularize: false       # hoist repeated keys from arrays of objects (lossless)
  json_drop_nulls: false       # prune null/empty JSON fields (lossy)
  # CCR (reversible compress-cache-retrieve): stash oversized blocks, drop a
  # stub the model expands via compress_retrieve tool / GET /v1/compress/retrieve.
  ccr_enabled: false
  ccr_threshold_chars: 4000
  ccr_capacity: 1024
  ccr_services: []             # X-Kronaxis-Service values allowed to receive CCR stubs
  # Learned prose compressor (self-hosted LLMLingua-2 GPU sidecar; lossy).
  # See services/prose-compressor/. Off unless url is set + enabled.
  prose_compressor:
    enabled: false
    url: ""                    # e.g. http://gpu-host:8056/compress
    rate: 0.5                  # fraction of prose tokens to keep
    min_chars: 600
    timeout_ms: 8000

  embedder:
    type: "local-st"           # local-st | ollama | gemini | openai
    url: "http://localhost:8053"   # local-st sidecar; default Docker service
    # model: "BAAI/bge-small-en-v1.5"   # only used if type=gemini/openai (st sidecar reads its own env)
    # api_key_env: "GEMINI_API_KEY"     # for type=gemini/openai
    # dim: 384                          # set for non-default embedder dim (must match ingest dim)
    # --- Ollama embedder (reuses a running Ollama; no extra sidecar) ---
    # type: "ollama"
    # url: "http://localhost:11434"
    # model: "nomic-embed-text"         # 768-dim; dim auto-probed if unset

  # Live re-ingest. Watches ingest_roots via fsnotify and re-ingests changed
  # files within ~2s. Independent from the cron-style one-shot ingest.
  watch_enabled: false

  # Concurrency: parallel embed batches during ingest (one-shot OR watch).
  ingest_concurrency: 4

  # Per-service auto-mode: when X-Kronaxis-Service is set and matches a key
  # below, use that mode instead of `default`. Lets each service opt into a
  # sensible default. Keys are example service names — replace with your own.
  service_overrides:
    chat-service: "augment"
    bulk-extractor: "compress"
    mixed-workload: "auto"
    search-service: "augment"
    monitoring: "off"

  # ────────────────────────────────────────────────────────────────────
  # KRONAXIS PLATFORM INTEGRATION (Router <-> Fabric)
  # ────────────────────────────────────────────────────────────────────
  # When fabric_url is set, the graphify pre-stage delegates retrieval
  # to the Fabric service's /v1/rag endpoint instead of running the
  # embedded pgvector + local sentence-transformers backend.
  #
  # If unset (the default), embedded behaviour is unchanged so single-
  # box deployments keep working. On any error contacting Fabric we log
  # and fall back to embedded retrieval -- a flaky Fabric host never
  # fails a chat request.
  #
  # Default weights are pure cosine. Router asks Fabric for code-chunk
  # relevance; Fabric's memo-search default of cosine 0.5 + tsvector
  # 0.3 + recency 0.2 is the wrong blend for that workload.
  fabric_url: ""                       # e.g. "http://fabric-host:8201"
  fabric_key: ""                       # Bearer token (supports env:VAR_NAME)
  fabric_timeout_ms: 5000              # cap per /v1/rag call
  # fabric_rag_weights:                # optional; defaults to pure cosine
  #   cosine: 1.0
  #   tsvector: 0.0
  #   recency: 0.0

# ──────────────────────────────────────────────────────────────────────
# SEMANTIC CACHE (fuzzy prompt caching)
# On an exact-cache miss, embed the prompt and return a cached answer if a
# stored prompt is cosine >= min_similarity. Reuses the graphify embedder +
# pgvector (needs graphify embedder + DATABASE_URL). Off by default.
# ──────────────────────────────────────────────────────────────────────
semantic_cache:
  enabled: false
  min_similarity: 0.96   # high by default — a near-duplicate returns a prior answer
